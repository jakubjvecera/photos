<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="icon.png" type="image/png" />
  <title>Jakub Večeřa</title>

  <style>
    body {
      margin: 0;
      font-family: Courier, sans-serif;
      color: #eee;
      background-color: #121212;
      background-image: repeating-linear-gradient(
        45deg, #1a1a1a 0px, #1a1a1a 1px, #121212 1px, #121212 12px
      );
      display: flex;
    }

    .blur { filter: blur(8px); transition: filter 0.3s ease; }
    .no-scroll { overflow: hidden; }

    #sidebar {
      width: 80px;
      background: #1c1c1c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 5px;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 1001;
    }

    #sidebar h1 {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 35px;
      margin: 0;
      letter-spacing: 2px;
      color: #ccc;
      user-select: none;
    }

    #logo {
      position: fixed;
      top: 320px;
      left: 20px;
      width: 40px;
      -webkit-user-drag: none;
      user-select: none;
    }

    #sidebar .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: absolute;
      bottom: 20px;
    }

    #sidebar .links a {
      color: #eee;
      text-decoration: none;
      font-size: 12px;
      background: #333;
      padding: 6px 10px;
      border-radius: 6px;
    }

    #gallery-container {
      margin-left: 80px;
      padding: 20px;
      width: 100%;
      overflow-y: auto;
    }

    #gallery {
      column-count: 4;
      column-gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 900px) { #gallery { column-count: 3; } }
    @media (max-width: 600px) { #gallery { column-count: 2; } }
    @media (max-width: 400px) { #gallery { column-count: 1; } }

    #gallery img {
      width: 100%;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.7);
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1100;
    }

    #lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(255,255,255,0.8);
    }
  </style>
</head>

<body>
  <div id="sidebar">
    <h1>Jakub Večeřa</h1>
    <img src="logo.png" id="logo" alt="Logo" />
    <div class="links">
      <a href="mailto:jakub.j.vecera@gmail.com">Email</a>
      <a href="https://instagram.com/jakubjvecera" target="_blank">Instagram</a>
      <a href="https://zonerama.com/jakubjvecera/" target="_blank">Zonerama</a>
    </div>
  </div>

  <div id="gallery-container">
    <div id="gallery"></div>
  </div>

  <div id="lightbox"></div>

  <noscript>
    <div style="padding:20px;text-align:center;color:white;">
      ⚠️ Stránka vyžaduje JavaScript.
    </div>
  </noscript>

  <script src="fotky.js"></script>
  <script>
    const BACKEND_URL = "https://photos-back.jakub-j-vecera.workers.dev/img/";

    const gallery = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    shuffle(fotky).forEach(name => {
      const img = document.createElement("img");
      img.src = BACKEND_URL + name + "?mode=thumb";
      img.loading = "lazy";
      img.draggable = false;

      img.addEventListener("click", () => {
        lightbox.innerHTML = "";
        const big = document.createElement("img");
        big.src = BACKEND_URL + name + "?mode=full";
        big.draggable = false;
        lightbox.appendChild(big);
        lightbox.style.display = "flex";
        document.body.classList.add("no-scroll");
      });

      gallery.appendChild(img);
    });

    lightbox.addEventListener("click", () => {
      lightbox.style.display = "none";
      lightbox.innerHTML = "";
      document.body.classList.remove("no-scroll");
    });

    document.addEventListener("contextmenu", e => e.preventDefault());
  </script>
</body>
</html>
